# Pulls the roadmap workbook out of the Nextcloud team folder and commits it,
# so the published chart shows what the theme leads have edited.
#
# This exists because a browser on durf-project.github.io cannot read a file
# from surf.works.surf.nl directly: the Nextcloud share does not send the CORS
# header that would permit it. Fetching once here, server-side, sidesteps that
# entirely -- and means one download per run rather than one per visitor.
#
# The share must be reachable without a password. Set the share URL in
# Settings -> Secrets and variables -> Actions -> Variables as ROADMAP_SHARE_URL
# to change it without editing this file.

name: Sync roadmap from Nextcloud

# The share link can be pasted as Nextcloud shows it (/s/<token>): tools/sync.py
# tries the WebDAV address for that token first and /download second.
# The first link of this project went stale when its file was replaced --
# see 'When a run fails' in the README.
on:
  schedule:
    - cron: "17 6-18 * * 1-5"    # hourly through the working day, UTC
  workflow_dispatch:             # or run it by hand from the Actions tab
    inputs:
      share_url:
        description: "Try this link instead of the usual one (a /s/<token> share link or a WebDAV address). Nothing is saved; set ROADMAP_SHARE_URL to make it permanent."
        required: false
        default: ""

concurrency:
  group: sync-roadmap
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet openpyxl

      # One step, and the same code you can run yourself (python3 tools/sync.py):
      # download with retries, refuse anything that is not a usable workbook,
      # then rebuild. On failure the log says what the server answered -- status,
      # headers and the start of its reply -- and what to check, which the old
      # curl-based steps could not. Nothing is written until the download has
      # been checked, so a failed run leaves the last good version published.
      - name: Download, check and rebuild
        env:
          SHARE_URL: ${{ inputs.share_url || vars.ROADMAP_SHARE_URL || 'https://surf.works.surf.nl/s/rZdbSgE2Z8gdzLk' }}
        run: python3 tools/sync.py "$SHARE_URL"

      - name: Commit if anything changed
        run: |
          set -euo pipefail
          if git diff --quiet -- data gantt.html; then
            echo "No change since the last sync."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data gantt.html
          git commit -m "Sync roadmap from Nextcloud"
          git push
